# Example configuration for Donkey Car RL pipeline

simulator:
  exe_path: "/path/to/donkey_sim.x86_64"  # Linux simulator
  # exe_path: "/path/to/DonkeySimMac/donkey_sim.app"  # macOS simulator
  host: "127.0.0.1"
  port: 9091
  car_name: "training"
  max_cte: 4.0
  max_throttle: 1.0
  min_throttle: -1.0
  max_steering: 1.0
  min_steering: -1.0

ae:
  z_size: 64
  c_hid: 64
  num_image_channels: 3
  learning_rate: 0.0001
  batch_size: 32
  epochs: 100
  noise_factor: 0.3
  num_threads: -1
  n_samples: -1

rl:
  algorithm: "SAC"  # or "PPO"
  total_timesteps: 50000
  learning_rate: 0.0003
  batch_size: 64
  buffer_size: 30000
  gamma: 0.99
  tau: 0.02
  learning_starts: 0
  gradient_steps: 600
  train_freq: [1, "episode"]
  ent_coef: "auto_0.1"
  eval_freq: 50
  n_eval_episodes: 5
  use_sde: true
  sde_sample_freq: 64
  seed: 42
  
  # PPO-specific
  n_steps: 2048
  n_epochs: 20
  gae_lambda: 0.95
  clip_range: 0.2

paths:
  base_dir: "./rl_outputs"
  data_dir: "data"
  ae_models_dir: "ae_models"
  rl_models_dir: "rl_models"
  logs_dir: "logs"
  training_images_dir: "training_images"
  tensorboard_dir: "tensorboard"
